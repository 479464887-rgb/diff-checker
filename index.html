<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Diff Checker - 左右分栏文本对比工具"><meta property="og:title" content="Diff Checker"><title>Diff Checker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}.container{max-width:1400px;margin:0 auto;padding:24px;height:calc(100vh - 80px);display:flex;flex-direction:column}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;flex-shrink:0}.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}.btn:hover{background:#30363d}.btn-primary{background:#238636;border-color:#238636;color:#fff}.btn-primary:hover{background:#2ea043}.main-content{display:flex;gap:12px;flex:1;min-height:0}@media(max-width:768px){.main-content{flex-direction:column}}.editor-pane{flex:1;display:flex;flex-direction:column;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}.pane-header{background:#21262d;padding:8px 16px;font-size:12px;font-weight:600;border-bottom:1px solid #30363d;color:#8b949e}.pane-header.original{color:#f85149}.pane-header.modified{color:#3fb950}.editor-pane textarea{flex:1;width:100%;background:#0d1117;color:#c9d1d9;border:none;padding:12px;font-family:monospace;font-size:13px;resize:none;line-height:1.5;tab-size:2}.editor-pane textarea:focus{outline:none}.diff-pane{flex:1;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.diff-content{flex:1;overflow-y:auto;padding:8px 0;font-family:monospace;font-size:12px;line-height:1.5}.diff-line{padding:2px 12px;white-space:pre-wrap;display:flex}.diff-line.added{background:rgba(35,134,54,.15);color:#7ee787}.diff-line.removed{background:rgba(218,54,51,.15);color:#f85149}.diff-line.unchanged{color:#8b949e}.diff-line .prefix{min-width:20px;color:#484f58;user-select:none}.stats-bar{padding:8px 16px;font-size:12px;color:#8b949e;background:#21262d;border-top:1px solid #30363d}</style></head><body><header><h1>🔍 Diff Checker</h1><div class="lang-switch"><button class="active" onclick="setLang("zh")">中文</button><button onclick="setLang("en")">EN</button></div></header><div class="container"><div class="toolbar"><button class="btn btn-primary" onclick="compare()">🔍 对比</button><button class="btn" onclick="swapTexts()">🔄 交换</button><button class="btn" onclick="clearAll()">🗑 清空</button></div><div class="main-content"><div class="editor-pane"><div class="pane-header original">原始文本 / Original</div><textarea id="text1" placeholder="输入原始文本...">The quick brown fox
jumps over the lazy dog
Hello World
This is a test</textarea></div><div class="editor-pane"><div class="pane-header modified">修改后 / Modified</div><textarea id="text2" placeholder="输入修改后文本...">The quick brown cat
jumps over the lazy dog
Hello Universe
This is a test
New line added</textarea></div><div class="diff-pane"><div class="pane-header">差异结果 / Diff Result</div><div class="diff-content" id="diffOutput"><div class="diff-line unchanged">输入文本后点击"对比"查看差异</div></div><div class="stats-bar" id="diffStats"></div></div></div></div><script>var lang="zh";function setLang(l){lang=l;document.querySelectorAll(".lang-switch button").forEach(function(b,i){b.classList.toggle("active",(i===0&&l==="zh")||(i===1&&l==="en"))})}function compare(){var t1=document.getElementById("text1").value;var t2=document.getElementById("text2").value;var lines1=t1.split("\n");var lines2=t2.split("\n");var lcs=computeLCS(lines1,lines2);var result=[];var i=0,j=0,k=0;var added=0,removed=0;while(i<lines1.length||j<lines2.length){if(k<lcs.length){var match=lcs[k];while(i<match.i){result.push({type:"removed",line:lines1[i]});removed++;i++}while(j<match.j){result.push({type:"added",line:lines2[j]});added++;j++}result.push({type:"unchanged",line:lines1[i]});i++;j++;k++}else{while(i<lines1.length){result.push({type:"removed",line:lines1[i]});removed++;i++}while(j<lines2.length){result.push({type:"added",line:lines2[j]});added++;j++}}}var html="";result.forEach(function(r){var cls=r.type==="added"?"added":r.type==="removed"?"removed":"unchanged";var pre=r.type==="added"?"+":r.type==="removed"?"-":" ";html+="<div class="diff-line "+cls+""><span class="prefix">"+pre+"</span>"+esc(r.line)+"</div>"});document.getElementById("diffOutput").innerHTML=html;document.getElementById("diffStats").textContent="+"+added+" 添加 | -"+removed+" 删除 | "+result.filter(function(r){return r.type==="unchanged"}).length+" 未变"}function computeLCS(a,b){var m=a.length,n=b.length;var dp=Array(m+1).fill(null).map(function(){return Array(n+1).fill(0)});for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);var result=[];var i=m,j=n;while(i>0&&j>0){if(a[i-1]===b[j-1]){result.unshift({i:i-1,j:j-1});i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}return result}function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function swapTexts(){var t1=document.getElementById("text1");var t2=document.getElementById("text2");var tmp=t1.value;t1.value=t2.value;t2.value=tmp}function clearAll(){document.getElementById("text1").value="";document.getElementById("text2").value="";document.getElementById("diffOutput").innerHTML="";document.getElementById("diffStats").textContent=""}</script></body></html>
